<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <form>
        <label for="Username"><b>Username:</b></label>
        <input type="text" id="Username" name="Username" placeholder="Enter Your Username" required><br><br>
        <label for="pass"><b>Password:</b></label>
        <input type="password" id="pass" name="pass" placeholder="Enter Your Password" required><br><br>
        <input type="checkbox" id="remeber" name="remeber" value="Remember">
        <label for="remeber"><b>Remember Me</b></label><br><br>
        <button type="submit">Login</button>
        <button type="reset">Cancel</button>
        <p>Forgot your <a href="#">Password</a>?</p>
    </form>
</body>
</html>
